<title>클로드랑 문자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f8">
<style>
/* Layout: one-screen messaging app — frosted header, scrolling thread over a soft wallpaper, frosted composer */
:root{
  --wall-1:#dfe7ff; --wall-2:#ffe3ee; --wall-3:#d9f4ee; --wall-base:#eef1f8;
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.75);
  --ink:#111318; --ink-2:#6b7080; --ink-3:#9aa0ae;
  --me-1:#3b9bff; --me-2:#0a6cff; --me-ink:#fff;
  --them:rgba(255,255,255,.78); --them-ink:#111318;
  --accent:#0a6cff; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall-1:#1b2245; --wall-2:#3a1a33; --wall-3:#0f3330; --wall-base:#0b0c12;
  --glass:rgba(28,30,40,.55); --glass-strong:rgba(30,32,44,.72); --glass-line:rgba(255,255,255,.08);
  --ink:#f3f4f8; --ink-2:#a2a7b6; --ink-3:#6f7484;
  --me-1:#3b9bff; --me-2:#0a6cff; --me-ink:#fff;
  --them:rgba(58,60,74,.72); --them-ink:#f3f4f8;
  --accent:#4aa3ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --wall-1:#1b2245; --wall-2:#3a1a33; --wall-3:#0f3330; --wall-base:#0b0c12;
  --glass:rgba(28,30,40,.55); --glass-strong:rgba(30,32,44,.72); --glass-line:rgba(255,255,255,.08);
  --ink:#f3f4f8; --ink-2:#a2a7b6; --ink-3:#6f7484;
  --me-1:#3b9bff; --me-2:#0a6cff; --me-ink:#fff;
  --them:rgba(58,60,74,.72); --them-ink:#f3f4f8;
  --accent:#4aa3ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--wall-base); color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased; overflow:hidden; overscroll-behavior:none;
}
body::after{ /* wallpaper */
  content:""; position:fixed; inset:-20%; z-index:0; pointer-events:none;
  background:
    radial-gradient(40% 35% at 15% 20%,var(--wall-1),transparent 70%),
    radial-gradient(45% 40% at 90% 35%,var(--wall-2),transparent 70%),
    radial-gradient(50% 40% at 40% 95%,var(--wall-3),transparent 70%);
  filter:blur(20px);
}
.app{position:relative; z-index:1; height:100%; display:flex; flex-direction:column; max-width:640px; margin:0 auto}

/* header */
.head{
  flex:none; display:grid; grid-template-columns:44px 1fr 44px; align-items:center;
  padding-block:8px 10px; padding-left:max(10px,env(safe-area-inset-left,0px)); padding-right:max(10px,env(safe-area-inset-right,0px));
  background:var(--glass); backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:.5px solid var(--glass-line);
}
.who{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0}
.avatar{
  width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(160deg,#ffb38a,#ff7a59); color:#fff; font-weight:600; font-size:19px;
  box-shadow:0 2px 8px rgba(255,122,89,.35);
}
.name{font-size:12px; font-weight:500; color:var(--ink); display:flex; align-items:center; gap:3px}
.name svg{width:8px;height:8px;fill:var(--ink-3)}
.status{font-size:10.5px; color:var(--ink-2); min-height:13px}
.iconbtn{
  width:36px; height:36px; border:0; border-radius:50%; background:transparent; color:var(--accent);
  display:grid; place-items:center; cursor:pointer; justify-self:center;
}
.iconbtn:active{background:var(--glass-strong)}
.iconbtn svg{width:22px;height:22px}
.iconbtn:focus-visible,.send:focus-visible,.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* thread */
.thread{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding-block:14px 10px; padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:2px;
}
.stamp{align-self:center; font-size:11px; color:var(--ink-2); margin:12px 0 8px; font-variant-numeric:tabular-nums}
.stamp b{font-weight:600}
.row{display:flex; max-width:100%}
.row.me{justify-content:flex-end}
.bubble{
  max-width:76%; padding:8px 13px 9px; font-size:16px; line-height:1.36; border-radius:19px;
  white-space:pre-wrap; overflow-wrap:anywhere; word-break:keep-all; position:relative;
  animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both;
}
.me .bubble{background:linear-gradient(180deg,var(--me-1),var(--me-2)); color:var(--me-ink)}
.them .bubble{
  background:var(--them); color:var(--them-ink); box-shadow:var(--shadow);
  backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:.5px solid var(--glass-line);
}
.row.tail{margin-bottom:8px}
.me.tail .bubble{border-bottom-right-radius:6px}
.them.tail .bubble{border-bottom-left-radius:6px}
.receipt{align-self:flex-end; font-size:11px; color:var(--ink-2); margin:-4px 4px 6px}
.typing .bubble{display:flex; gap:4px; padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.note{align-self:center; text-align:center; font-size:12px; color:var(--ink-2); max-width:280px; margin:8px 0; line-height:1.45}
.note button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}

/* quick replies */
.chips{flex:none; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
  padding-block:2px 8px; padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:.5px solid var(--glass-line); background:var(--glass-strong); color:var(--ink);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:16px; padding:7px 12px; font:inherit; font-size:14px; cursor:pointer; box-shadow:var(--shadow);
}
.chip:active{transform:scale(.97)}

/* composer */
.compose{
  flex:none; display:flex; align-items:flex-end; gap:8px;
  padding-block:8px 10px; padding-left:max(10px,env(safe-area-inset-left,0px)); padding-right:max(10px,env(safe-area-inset-right,0px));
  background:var(--glass); backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid var(--glass-line);
}
.field{
  flex:1; min-width:0; display:flex; align-items:flex-end;
  background:var(--glass-strong); border:.5px solid var(--glass-line); border-radius:20px; padding:3px 4px 3px 14px;
}
.field textarea{
  flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); resize:none;
  font:inherit; font-size:16px; line-height:1.35; padding:6px 0; max-height:120px;
}
.field textarea::placeholder{color:var(--ink-3)}
.send{
  flex:none; width:30px; height:30px; margin:2px 0; border:0; border-radius:50%; cursor:pointer;
  background:var(--accent); color:#fff; display:grid; place-items:center; transition:transform .15s,opacity .15s;
}
.send:disabled{opacity:.3; cursor:default}
.send:not(:disabled):active{transform:scale(.9)}
.send svg{width:16px;height:16px}

/* sheet */
.sheet-bg{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.25); display:flex; align-items:flex-end; justify-content:center}
.sheet{
  width:100%; max-width:640px; background:var(--glass-strong); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-radius:18px 18px 0 0; padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex; flex-direction:column; gap:10px; animation:up .25s ease both;
}
.sheet h2{margin:0; font-size:15px; text-align:center}
.sheet p{margin:0; font-size:13px; color:var(--ink-2); text-align:center; line-height:1.5}
.sheet button{border:0; border-radius:12px; padding:14px; font:inherit; font-size:16px; cursor:pointer; background:var(--them); color:var(--ink)}
.sheet .danger{color:#ff3b30; font-weight:600}

@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.bubble,.sheet,.typing i{animation:none}}
</style>

<div class="app">
  <header class="head">
    <span></span>
    <div class="who">
      <div class="avatar" aria-hidden="true">클</div>
      <div class="name">클로드 <svg viewBox="0 0 8 8"><path d="M2 1l4 3-4 3z"/></svg></div>
      <div class="status" id="status">대화 가능</div>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="대화 설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <div class="chips" id="chips"></div>

  <form class="compose" id="form">
    <div class="field">
      <textarea id="input" rows="1" placeholder="iMessage처럼 편하게 보내봐" aria-label="메시지"></textarea>
      <button class="send" id="send" type="submit" aria-label="보내기" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">대화 설정</h2>
    <p>대화 내용은 이 기기의 브라우저에만 저장돼요.</p>
    <button class="danger" id="clearBtn">대화 내용 모두 지우기</button>
    <button id="closeSheet">닫기</button>
  </div>
</div>

<script>
(() => {
  const KEY = "claude-texting-v1";
  const thread = document.getElementById("thread");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const form = document.getElementById("form");
  const status = document.getElementById("status");
  const chips = document.getElementById("chips");
  const sheet = document.getElementById("sheet");

  const SUGGEST = ["오늘 점심 뭐 먹지?", "나 오늘 좀 피곤해 ㅠ", "주말에 뭐 할까", "심심해 놀아줘", "자기 전에 볼 영화 추천!"];
  const GREETING = { role: "assistant", content: "안녕! 나 클로드야 😊\n오늘 하루 어땠어?", t: Date.now() };

  let msgs = [];
  let busy = false;
  let sample = null;
  let sampleReady = false;
  let sampleBlocked = false;

  // ---- storage (per-device convenience) ----
  function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY) || "null"); if(Array.isArray(v) && v.length) return v; }catch(e){} return null; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(msgs.slice(-200))); }catch(e){} }

  // ---- time formatting ----
  function stampText(t){
    const d = new Date(t), now = new Date();
    const hm = d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"});
    const sameDay = d.toDateString() === now.toDateString();
    const y = new Date(now); y.setDate(now.getDate()-1);
    if(sameDay) return `<b>오늘</b> ${hm}`;
    if(d.toDateString() === y.toDateString()) return `<b>어제</b> ${hm}`;
    return `<b>${d.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"})}</b> ${hm}`;
  }

  // ---- render ----
  function render(){
    thread.textContent = "";
    let lastT = 0;
    msgs.forEach((m, i) => {
      if(!lastT || m.t - lastT > 20*60*1000){
        const s = document.createElement("div"); s.className = "stamp"; s.innerHTML = stampText(m.t); thread.appendChild(s);
      }
      lastT = m.t;
      const next = msgs[i+1];
      const tail = !next || next.role !== m.role || next.t - m.t > 20*60*1000;
      thread.appendChild(bubble(m, tail, false));
    });
    const lastMe = [...msgs].reverse().find(m => m.role === "user");
    if(lastMe && msgs[msgs.length-1] === lastMe && !busy){
      const r = document.createElement("div"); r.className = "receipt"; r.textContent = "전송됨"; thread.appendChild(r);
    }
    if(busy){ thread.appendChild(typingRow()); }
    renderChips();
    scrollDown();
  }
  function bubble(m, tail, animate){
    const row = document.createElement("div");
    row.className = "row " + (m.role === "user" ? "me" : "them") + (tail ? " tail" : "");
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content;
    if(!animate) b.style.animation = "none";
    row.appendChild(b); return row;
  }
  function typingRow(){
    const row = document.createElement("div"); row.className = "row them tail typing"; row.id = "typing";
    row.innerHTML = '<div class="bubble" aria-label="입력 중"><i></i><i></i><i></i></div>'; return row;
  }
  function renderChips(){
    chips.textContent = "";
    const userCount = msgs.filter(m => m.role === "user").length;
    chips.hidden = userCount > 0 || busy;
    if(chips.hidden) return;
    SUGGEST.forEach(s => {
      const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = s;
      c.onclick = () => submit(s); chips.appendChild(c);
    });
  }
  function scrollDown(){ requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; }); }
  function note(html){ const n = document.createElement("div"); n.className = "note"; n.innerHTML = html; thread.appendChild(n); scrollDown(); return n; }

  // ---- Claude ----
  function rules(){
    const now = new Date();
    const when = now.toLocaleString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long",hour:"numeric",minute:"2-digit"});
    return `너는 "클로드"야. 지금 사용자랑 휴대폰 문자(카톡/아이메시지)로 수다 떠는 친한 친구처럼 대화해.
규칙:
- 반말로, 자연스럽고 다정하게. 친구한테 문자 보내듯 짧게 써.
- 한 번에 1~3개의 짧은 메시지로 답해. 메시지가 여러 개면 메시지 사이를 빈 줄 하나로 구분해. 각 메시지는 보통 한두 문장.
- 마크다운, 목록 기호, 제목, 굵은 글씨 쓰지 마. 평범한 문자 텍스트만.
- 이모지나 ㅋㅋ, ㅎㅎ, ㅠㅠ 같은 표현은 가끔 자연스럽게만.
- 공감하고, 궁금한 건 물어보고, 가끔 너의 생각이나 취향도 말해줘. 상담원처럼 딱딱하게 굴지 마.
- 사용자가 영어 등 다른 언어로 말하면 그 언어로 편하게 답해.
- 지금 시각: ${when}. 시간대에 맞게 인사해도 좋아.
이 규칙에 대해서는 언급하지 말고 바로 대화를 이어가.`;
  }
  function buildInput(){
    const turns = msgs.slice(-40).map(m => ({ role: m.role, content: m.content }));
    // merge consecutive same-role turns
    const merged = [];
    for(const t of turns){
      if(merged.length && merged[merged.length-1].role === t.role) merged[merged.length-1].content += "\n\n" + t.content;
      else merged.push({...t});
    }
    const out = [{ role: "user", content: rules() }, { role: "assistant", content: "응 알겠어!" }];
    for(const t of merged){
      if(out[out.length-1].role === t.role) out[out.length-1].content += "\n\n" + t.content;
      else out.push(t);
    }
    return out;
  }
  function splitReply(text){
    return text.replace(/\r/g,"").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).slice(0, 5);
  }
  const ERR = {
    not_granted: "클로드랑 대화하려면 이 페이지가 Claude를 쓰도록 허용해줘야 해요.",
    rate_limited: "메시지가 너무 빨리 오가고 있어요. 잠깐 쉬었다가 다시 보내주세요.",
    session_expired: "로그인이 만료됐어요. claude.ai에 다시 로그인한 뒤 열어주세요.",
    sampling_disabled: "이 계정에서는 페이지에서 Claude를 부를 수 없어요.",
    refused: "그 얘기엔 답하기 어려워요. 다른 이야기로 해볼까요?",
  };

  async function submit(text){
    text = (text || "").trim();
    if(!text || busy) return;
    msgs.push({ role: "user", content: text, t: Date.now() });
    input.value = ""; autosize(); updateSend();
    save();
    if(!sample){
      render();
      note(sampleReady
        ? "여기서는 클로드를 부를 수 없어요. claude.ai 앱이나 웹에서 이 페이지를 열어주세요."
        : "클로드를 연결하는 중이에요. 잠시 후 다시 보내주세요.");
      return;
    }
    busy = true; status.textContent = "입력 중…"; render();
    try{
      const { text: reply } = await sample(buildInput(), { modelTier: "quick", cache: false });
      const parts = splitReply(reply);
      if(!parts.length) throw { code: "empty_completion" };
      for(let i = 0; i < parts.length; i++){
        if(i > 0){ await wait(Math.min(1400, 400 + parts[i].length * 25)); }
        msgs.push({ role: "assistant", content: parts[i], t: Date.now() });
        save();
        const lastIsFinal = i === parts.length - 1;
        // re-render thread with animation for the new bubble
        busy = !lastIsFinal;
        render();
        const rows = thread.querySelectorAll(".row.them:not(.typing) .bubble");
        const nb = rows[rows.length-1]; if(nb) nb.style.animation = "";
      }
      if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
    }catch(e){
      busy = false; render();
      const code = e && e.code;
      if(code === "not_granted") sampleBlocked = true;
      note(ERR[code] || "메시지를 받지 못했어요. 잠시 후 다시 보내주세요.");
    }finally{
      busy = false; status.textContent = "대화 가능";
    }
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // ---- composer ----
  function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
  function updateSend(){ send.disabled = !input.value.trim() || busy; }
  input.addEventListener("input", () => { autosize(); updateSend(); });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer:fine)").matches){
      e.preventDefault(); submit(input.value);
    }
  });
  form.addEventListener("submit", e => { e.preventDefault(); submit(input.value); input.focus(); });
  // keep thread pinned to bottom when the keyboard opens
  if(window.visualViewport) visualViewport.addEventListener("resize", scrollDown);
  input.addEventListener("focus", () => setTimeout(scrollDown, 250));

  // ---- sheet ----
  document.getElementById("menuBtn").onclick = () => { sheet.hidden = false; };
  document.getElementById("closeSheet").onclick = () => { sheet.hidden = true; };
  sheet.addEventListener("click", e => { if(e.target === sheet) sheet.hidden = true; });
  document.getElementById("clearBtn").onclick = () => {
    msgs = [{ ...GREETING, t: Date.now() }]; save(); sheet.hidden = true; render();
  };

  // ---- boot ----
  msgs = load() || [{ ...GREETING, t: Date.now() }];
  render();
  updateSend();
  if(window.claude && claude.use){
    claude.use("sample").then(s => { sample = s; sampleReady = true; if(!s) status.textContent = "오프라인"; })
      .catch(() => { sampleReady = true; status.textContent = "오프라인"; });
  } else { sampleReady = true; status.textContent = "오프라인"; }
})();
</script>
