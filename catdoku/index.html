<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥도쿠</title>
<style>
/* 한 화면 퍼즐: 상단 바 · 안내 줄 · 정사각 보드 · 도구/힌트 줄 */
:root{
  --bg:#f7f3ee; --panel:#ffffff; --ink:#2e2724; --muted:#8c7d74; --grid:rgba(60,40,30,.18);
  --wall:#3a2c25; --btn:#ece3da; --btnh:#e2d5c8; --accent:#d9692b; --bad:#d63a2f; --hl:rgba(255,255,255,.45);
  --r0:#f39a96; --r1:#f7e07e; --r2:#bfe3a5; --r3:#a9d8ef; --r4:#cdb9f2;
  --r5:#f7c3e0; --r6:#a8e3d4; --r7:#e6d7b4; --r8:#c9cfd9; --r9:#f5b56a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1916; --panel:#28221e; --ink:#f2e8df; --muted:#a3948a; --grid:rgba(0,0,0,.35);
    --wall:#0e0b09; --btn:#372e29; --btnh:#463a33; --accent:#ff9150; --bad:#ff6b5e; --hl:rgba(255,255,255,.18);
    --r0:#a84f4b; --r1:#a39445; --r2:#6a8c55; --r3:#4f7f99; --r4:#7a66a3;
    --r5:#9e6688; --r6:#4f8c7c; --r7:#8f8263; --r8:#6c7380; --r9:#a8703a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1916; --panel:#28221e; --ink:#f2e8df; --muted:#a3948a; --grid:rgba(0,0,0,.35);
  --wall:#0e0b09; --btn:#372e29; --btnh:#463a33; --accent:#ff9150; --bad:#ff6b5e; --hl:rgba(255,255,255,.18);
  --r0:#a84f4b; --r1:#a39445; --r2:#6a8c55; --r3:#4f7f99; --r4:#7a66a3;
  --r5:#9e6688; --r6:#4f8c7c; --r7:#8f8263; --r8:#6c7380; --r9:#a8703a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:540px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:26px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;color:var(--ink)}
select{background:var(--btn);border:none;border-radius:8px;padding:6px 8px}
.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer}
.ghostbtn{background:var(--btn);border:none;border-radius:8px;padding:6px 12px;cursor:pointer}
.stats{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.lives{font-size:18px;letter-spacing:2px}
.lives .gone{opacity:.2;filter:grayscale(1)}
.msg{min-height:2.9em;font-size:14px;line-height:1.45;color:var(--ink);background:var(--btn);border-radius:10px;
  padding:8px 12px;display:flex;align-items:center}
.msg:empty::before{content:"좌클릭으로 ✕ 메모, 우클릭으로 고양이를 찾아요.";color:var(--muted)}
.msg.warn{color:var(--bad);font-weight:600}
.board{display:grid;aspect-ratio:1;max-width:100%;border:3px solid var(--wall);border-radius:8px;overflow:hidden;
  user-select:none;touch-action:none;background:var(--wall)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 0 0 .5px var(--grid);line-height:1}
.cell.bt{border-top:2.5px solid var(--wall)} .cell.bl{border-left:2.5px solid var(--wall)}
.cell .m{pointer-events:none;position:relative;z-index:2}
.cell .x{color:var(--ink);opacity:.4;font-weight:700}
.cell .no{color:var(--ink);opacity:.8;font-weight:900}
.cell .dot{width:18%;aspect-ratio:1;border-radius:50%;background:var(--ink);opacity:.25}
.cell .cat{animation:pop .25s}
.cell .ghost{opacity:.45}
.cell.start::before{content:"처음";position:absolute;top:2px;left:3px;font-size:9px;font-weight:700;color:var(--ink);opacity:.6;z-index:2}
.cell.wrong{animation:shake .4s}
.cell.wrong .no{color:var(--bad);opacity:1}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.board.focus .cell:not(.hu):not(.ht){filter:saturate(.35) brightness(.88)}
.cell.hu::after{content:"";position:absolute;inset:0;background:var(--hl);z-index:1}
.cell.ht{box-shadow:inset 0 0 0 3px var(--accent)}
.cell.ht::after{content:"";position:absolute;inset:0;background:var(--hl);z-index:1;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cell .cat,.cell.wrong,.cell.ht::after{animation:none}}
.bar{display:grid;gap:8px}
.tools{grid-template-columns:repeat(3,1fr)}
.hints{grid-template-columns:repeat(3,1fr)}
.bar button{background:var(--btn);border:none;border-radius:10px;padding:9px 4px;cursor:pointer;font-size:14px}
.bar button:hover{background:var(--btnh)}
.bar button.on{background:var(--accent);color:#fff}
.bar button:focus-visible,.primary:focus-visible,.ghostbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.label{font-size:12px;color:var(--muted);margin-bottom:-4px;letter-spacing:.05em}
.opts{font-size:14px}
.help{font-size:13px;color:var(--muted);line-height:1.7}
.help b{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:24px;text-align:center;max-width:340px;width:100%}
.modal .big{font-size:56px}
.modal h2{margin:8px 0}
.modal .row{justify-content:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐾 냥도쿠</h1>
    <div class="row">
      <select id="size" aria-label="판 크기">
        <option value="5">5×5</option><option value="6">6×6</option><option value="7" selected>7×7</option>
        <option value="8">8×8</option><option value="9">9×9</option><option value="10">10×10</option>
      </select>
      <button class="primary" id="newBtn">새 게임</button>
    </div>
  </header>
  <div class="stats">
    <span class="lives" id="lives" aria-label="생명"></span>
    <span>찾은 고양이 <b id="found">0</b>/<b id="total">7</b></span>
    <span>⏱ <b id="time">00:00</b></span>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="board" id="board" role="grid" aria-label="퍼즐 판"></div>
  <div class="label">힌트</div>
  <div class="bar hints">
    <button id="hCat">🐱 고양이 위치<small>사용 <span id="uCat">0</span>번</small></button>
    <button id="hNo">✕ 없는 위치<small>사용 <span id="uNo">0</span>번</small></button>
    <button id="hInfo">💡 정보 하나<small>사용 <span id="uInfo">0</span>번</small></button>
  </div>
  <div class="bar tools">
    <button id="undoBtn">↩️ 되돌리기<small>✕ 메모만 (Z)</small></button>
    <button id="clearBtn">🧹 ✕ 모두 지우기<small>내 메모만</small></button>
    <button id="modeBtn">🐾 찾기 모드<small>좌클릭도 찾기</small></button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="autoX"> 찾은 고양이 때문에 고양이가 못 오는 칸에 점 표시</label>
  </div>
  <div class="help">
    <b>규칙</b> · N×N 판에 고양이 N마리가 숨어 있어요. ① 색깔 구역마다 1마리 ② 가로줄·세로줄마다 1마리 ③ 고양이끼리는 대각선 포함 주변 8칸에 붙어 있지 않아요.<br>
    <b>조작</b> · <b>좌클릭</b> ✕ 메모 켜기/끄기 (드래그로 여러 칸) · <b>우클릭</b> 고양이 찾기. 틀리면 생명 ❤️ 하나가 줄고, 3개를 다 잃으면 끝나요.
  </div>
</div>
<div class="overlay" id="ov"><div class="modal">
  <div class="big" id="ovIcon">😻</div>
  <h2 id="ovTitle">고양이를 다 찾았어요!</h2>
  <div id="ovText"></div>
  <div class="row">
    <button class="ghostbtn" id="retryBtn">같은 판 다시</button>
    <button class="primary" id="ovBtn">새 게임</button>
  </div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const EMPTY=0,X=1,CAT=2,NO=3; // X: 내 메모(틀릴 수 있음), NO: 확정된 "고양이 없음"
const LIVES=3;
const COLOR_NAMES=['빨간','노란','연두','하늘색','보라','분홍','민트','베이지','회색','주황'];
let S,drag=null,focus=null,flashCell=-1,findMode=false;

// ================= 퍼즐 생성 =================
const rnd=n=>Math.random()*n|0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function randomSolution(n){ // sol[r] = r번째 줄 고양이의 열
  const sol=[],used=Array(n).fill(false);
  (function go(r){
    if(r===n)return true;
    for(const c of shuffle([...Array(n).keys()])){
      if(used[c]||(r&&Math.abs(c-sol[r-1])<2))continue;
      used[c]=true;sol[r]=c;if(go(r+1))return true;used[c]=false;
    }
    return false;
  })(0);
  return sol;
}
function growRegions(n,sol){ // 고양이 칸에서 시작해 이어진 색깔 구역을 키움
  const reg=Array(n*n).fill(-1),size=Array(n).fill(1);
  sol.forEach((c,r)=>reg[r*n+c]=r);
  let left=n*n-n;
  while(left){
    const cand=[];
    for(let i=0;i<n*n;i++)if(reg[i]<0){
      const r=i/n|0,c=i%n;
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=n||cc>=n)continue;
        const g=reg[rr*n+cc];if(g>=0)cand.push([i,g]);
      }
    }
    let tot=0;const w=cand.map(([,g])=>{const x=1/(size[g]**1.2);tot+=x;return x});
    let t=Math.random()*tot,k=0;while((t-=w[k])>0&&k<cand.length-1)k++;
    const [i,g]=cand[k];reg[i]=g;size[g]++;left--;
  }
  // 색 번호를 섞어서 줄 순서와 색이 겹치지 않게
  const perm=shuffle([...Array(n).keys()]);
  return reg.map(g=>perm[g]);
}
// 정답과 다른 답 하나 찾기 (fixRow 줄은 정답 칸으로 고정 = 처음 알려 준 고양이)
function findOther(n,reg,sol,fixRow=-1){
  const colUsed=Array(n).fill(false),regUsed=Array(n).fill(false),cur=[];let found=null;
  (function go(r,prev,diff){
    if(found)return;
    if(r===n){if(diff)found=cur.slice();return}
    for(let c=0;c<n;c++){
      if(r===fixRow&&c!==sol[r])continue;
      const g=reg[r*n+c];
      if(colUsed[c]||regUsed[g]||(r&&Math.abs(c-prev)<2))continue;
      colUsed[c]=regUsed[g]=true;cur[r]=c;go(r+1,c,diff||c!==sol[r]);colUsed[c]=regUsed[g]=false;
      if(found)return;
    }
  })(0,-9,false);
  return found;
}
function staysConnected(n,reg,i){
  const g=reg[i],cells=[];for(let j=0;j<n*n;j++)if(j!==i&&reg[j]===g)cells.push(j);
  if(!cells.length)return false;
  const seen=new Set([cells[0]]),st=[cells[0]];
  while(st.length){const a=st.pop(),r=a/n|0,c=a%n;
    for(const b of [r?a-n:-1,r<n-1?a+n:-1,c?a-1:-1,c<n-1?a+1:-1])
      if(b>=0&&b!==i&&reg[b]===g&&!seen.has(b)){seen.add(b);st.push(b)}}
  return seen.size===cells.length;
}
function generate(n){
  for(;;){
    const sol=randomSolution(n),reg=growRegions(n,sol);
    const isSol=new Set(sol.map((c,r)=>r*n+c));
    for(let step=0;step<400;step++){
      const alt=findOther(n,reg,sol);
      if(!alt)return {sol,reg,given:-1};
      // 정보가 부족하면: 고양이 한 마리를 처음에 알려 주면 답이 하나로 정해지는지 확인
      if(step>=120)for(const r of shuffle([...Array(n).keys()]))
        if(!findOther(n,reg,sol,r))return {sol,reg,given:r*n+sol[r]};
      // 아니면 다른 답의 칸 하나를 옆 구역으로 넘겨 그 답을 막음
      const moves=[];
      alt.forEach((c,r)=>{const i=r*n+c;if(isSol.has(i))return;
        for(const j of [r?i-n:-1,r<n-1?i+n:-1,c?i-1:-1,c<n-1?i+1:-1])
          if(j>=0&&reg[j]!==reg[i])moves.push([i,reg[j]]);});
      shuffle(moves);
      const mv=moves.find(([i])=>staysConnected(n,reg,i));
      if(!mv)break;
      reg[mv[0]]=mv[1];
    }
  }
}

// ================= 게임 상태 =================
function newGame(n){
  const p=generate(n);
  S={n,sol:p.sol,reg:p.reg,given:p.given,time:0,done:false,lost:false};
  reset();
}
function reset(){ // 같은 판 처음부터
  const n=S.n;
  S.mark=Array(n*n).fill(EMPTY);if(S.given>=0)S.mark[S.given]=CAT;
  S.hist=[];S.lives=LIVES;S.use={cat:0,no:0,info:0};S.time=0;S.done=false;S.lost=false;
  focus=null;build();save();render();
  say(S.given>=0?'이 판은 정보가 부족해서 고양이 한 마리를 먼저 알려 줬어요. ("처음" 표시)':'');
}
function save(){try{localStorage.setItem('nyang3',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('nyang3'));if(s&&s.reg&&!s.done){S=s;return true}}catch(e){}return false}

const isCatCell=i=>S.sol[i/S.n|0]===i%S.n;
const near=(a,b,n)=>Math.abs((a/n|0)-(b/n|0))<=1&&Math.abs(a%n-b%n)<=1;
function blockedBy(i){ // 고양이 i 때문에 고양이가 올 수 없는 칸
  const n=S.n,r=i/n|0,c=i%n,out=[];
  for(let j=0;j<n*n;j++)if(j!==i&&((j/n|0)===r||j%n===c||S.reg[j]===S.reg[i]||near(i,j,n)))out.push(j);
  return out;
}

// ---- 표시 바꾸기 ----
function setX(changes){ // 좌클릭 메모: [[칸, X|EMPTY]]
  const real=changes.filter(([i,v])=>(S.mark[i]===EMPTY||S.mark[i]===X)&&S.mark[i]!==v);
  if(!real.length){render();return}
  S.hist.push(real.map(([i])=>[i,S.mark[i]]));if(S.hist.length>300)S.hist.shift();
  for(const [i,v] of real)S.mark[i]=v;
  focus=null;save();render();
}
function undo(){
  if(S.done)return;
  while(S.hist.length){
    const h=S.hist.pop().filter(([i])=>S.mark[i]===EMPTY||S.mark[i]===X);
    if(h.length){for(const [i,v] of h)S.mark[i]=v;focus=null;save();render();return}
  }
}
function guess(i){ // 우클릭: 고양이 찾기
  if(S.done)return;const m=S.mark[i];if(m===CAT||m===NO)return;
  focus=null;
  if(isCatCell(i)){S.mark[i]=CAT;say('찾았어요! 🐱');checkWin()}
  else{
    S.mark[i]=NO;S.lives--;flashCell=i;
    if(S.lives>0)say(`여기엔 고양이가 없어요. 생명이 하나 줄었어요. (남은 생명 ${S.lives})`,true);
    else lose();
  }
  save();render();
}
function checkWin(){
  if(!S.sol.every((c,r)=>S.mark[r*S.n+c]===CAT))return;
  S.done=true;save();
  const u=S.use,hints=u.cat+u.no+u.info;
  $('ovIcon').textContent='😻';$('ovTitle').textContent='고양이를 다 찾았어요!';
  $('ovText').textContent=`${S.n}×${S.n} · ${fmt(S.time)} · 남은 생명 ${'❤️'.repeat(S.lives)}`+
    (hints?` · 힌트 ${hints}번`:' · 힌트 없이 성공!');
  setTimeout(()=>$('ov').classList.add('show'),400);
}
function lose(){
  S.done=true;S.lost=true;save();
  $('ovIcon').textContent='😿';$('ovTitle').textContent='생명을 다 썼어요';
  $('ovText').textContent='숨은 고양이 위치를 판에 흐리게 보여 줄게요.';
  setTimeout(()=>$('ov').classList.add('show'),500);
}

// ================= 힌트 =================
function hintCat(){
  if(S.done)return;const n=S.n;
  const rows=[];for(let r=0;r<n;r++)if(S.mark[r*n+S.sol[r]]!==CAT)rows.push(r);if(!rows.length)return;
  const r=rows[rnd(rows.length)],i=r*n+S.sol[r];
  S.use.cat++;S.mark[i]=CAT;focus={unit:new Set(),target:new Set([i])};
  say('여기에 고양이가 있어요.');checkWin();save();render();
}
function hintNo(){
  if(S.done)return;const n=S.n;
  const blk=new Set();S.mark.forEach((m,i)=>{if(m===CAT)blockedBy(i).forEach(j=>blk.add(j))});
  // 아직 확정 안 됐고, 찾은 고양이로 바로 알 수 없는 칸을 우선
  let pool=[];for(let i=0;i<n*n;i++)if(!isCatCell(i)&&S.mark[i]!==NO&&!blk.has(i))pool.push(i);
  if(!pool.length)for(let i=0;i<n*n;i++)if(!isCatCell(i)&&S.mark[i]!==NO)pool.push(i);
  if(!pool.length)return;
  const i=pool[rnd(pool.length)];
  S.use.no++;S.mark[i]=NO;focus={unit:new Set(),target:new Set([i])};
  say('여기엔 고양이가 없어요.');save();render();
}
function hintInfo(){
  if(S.done)return;
  const f=analyze();
  if(!f){say('지금 표시만으로 바로 알 수 있는 게 없어요. 다른 힌트를 써 보세요.');return}
  S.use.info++;focus={unit:new Set(f.unit),target:new Set(f.target)};
  say('💡 '+f.msg);save();render();
}

// 지금 아는 것(찾은 고양이, 확정 ✕, 맞게 친 ✕ 메모)으로 추론 한 단계 찾기
function unitName(t,k){return t==='row'?`위에서 ${k+1}번째 가로줄`:t==='col'?`왼쪽에서 ${k+1}번째 세로줄`:`${COLOR_NAMES[k]} 구역`}
const TYPE_WORD={row:'가로줄',col:'세로줄',reg:'구역'};
function analyze(){
  const n=S.n,N=n*n;
  const keyOf={row:i=>i/n|0,col:i=>i%n,reg:i=>S.reg[i]};
  const units={row:[],col:[],reg:[]};
  for(const t in units)for(let k=0;k<n;k++)units[t].push([]);
  for(let i=0;i<N;i++)for(const t in units)units[t][keyOf[t](i)].push(i);
  const cats=[];S.mark.forEach((m,i)=>{if(m===CAT)cats.push(i)});
  const blk=new Set();cats.forEach(i=>blockedBy(i).forEach(j=>blk.add(j)));

  // 1) 찾은 고양이 주변·같은 줄·같은 구역인데 아직 표시 안 한 칸
  if(!$('autoX').checked)for(const c of cats){
    const t=blockedBy(c).filter(j=>S.mark[j]===EMPTY);
    if(t.length)return{msg:'이 고양이와 같은 가로줄·세로줄·구역이거나 바로 옆이라, 깜빡이는 칸에는 고양이가 없어요.',unit:[c],target:t};
  }
  const knownNo=i=>S.mark[i]===NO||(S.mark[i]===X&&!isCatCell(i))||blk.has(i);
  const cand=i=>S.mark[i]!==CAT&&!knownNo(i);
  const open={};for(const t in units)open[t]=[...Array(n).keys()].filter(k=>!units[t][k].some(i=>S.mark[i]===CAT));

  // 2) 고양이가 올 수 있는 칸이 하나뿐인 줄/구역
  for(const t of ['reg','row','col'])for(const k of open[t]){
    const c=units[t][k].filter(cand);
    if(c.length===1)return{msg:`${unitName(t,k)}에서 고양이가 올 수 있는 칸은 여기 하나뿐이에요.`,unit:units[t][k],target:c};
  }
  // 3) k개 구역(줄)의 고양이가 k개 줄(구역) 안에만 들어갈 수 있음 → 그 줄(구역)의 나머지 칸 제외
  const combos=(arr,k)=>{const out=[];(function go(s,acc){if(acc.length===k){out.push(acc.slice());return}
    for(let i=s;i<arr.length;i++){acc.push(arr[i]);go(i+1,acc);acc.pop()}})(0,[]);return out};
  for(let k=1;k<=3;k++)for(const A of ['reg','row','col'])for(const B of ['reg','row','col']){
    if(A===B||open[A].length<=k)continue;
    for(const grp of combos(open[A],k)){
      const inA=new Set(grp.flatMap(a=>units[A][a]));
      const bs=new Set();for(const i of inA)if(cand(i))bs.add(keyOf[B](i));
      if(bs.size!==k)continue;
      const elim=[...bs].flatMap(b=>units[B][b]).filter(i=>cand(i)&&!inA.has(i));
      if(!elim.length)continue;
      const an=grp.map(a=>unitName(A,a)).join(', '),bn=[...bs].map(b=>unitName(B,b)).join(', ');
      const msg=k===1?`${an}의 고양이는 ${bn} 안에만 올 수 있어요. 그래서 ${bn}의 깜빡이는 칸에는 고양이가 없어요.`
                     :`${an}의 고양이 ${k}마리는 ${bn} 안에만 들어갈 수 있어요. 그래서 이 ${TYPE_WORD[B]}들의 깜빡이는 칸에는 고양이가 없어요.`;
      return{msg,unit:[...inA],target:elim};
    }
  }
  // 4) 여기에 고양이를 놓으면 어떤 줄/구역에 고양이 자리가 사라짐
  for(let i=0;i<N;i++)if(cand(i)){
    const gone=new Set(blockedBy(i));gone.add(i);
    for(const t of ['reg','row','col'])for(const k of open[t]){
      if(units[t][k].includes(i))continue;
      if(!units[t][k].some(j=>cand(j)&&!gone.has(j)))
        return{msg:`깜빡이는 칸에 고양이가 있으면 ${unitName(t,k)}에 고양이가 들어갈 자리가 없어져요. 그래서 여기엔 고양이가 없어요.`,unit:units[t][k],target:[i]};
    }
  }
  return null;
}

let sayWarn=false;
function say(t,warn=false){$('msg').textContent=t;$('msg').classList.toggle('warn',warn)}
const fmt=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');

// ================= 화면 =================
const board=$('board');
function build(){
  const n=S.n;board.innerHTML='';
  board.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  board.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;
  const fs=Math.min(40,Math.max(14,300/n));
  for(let i=0;i<n*n;i++){
    const d=document.createElement('div'),r=i/n|0,c=i%n;
    d.className='cell'+(r&&S.reg[i]!==S.reg[i-n]?' bt':'')+(c&&S.reg[i]!==S.reg[i-1]?' bl':'')+(i===S.given?' start':'');
    d.style.background=`var(--r${S.reg[i]})`;
    d.style.fontSize=`clamp(12px,${fs/5.4}vw,${fs}px)`;
    d.dataset.i=i;d.setAttribute('role','gridcell');
    board.appendChild(d);
  }
  $('total').textContent=n;$('size').value=n;
}
function render(){
  const blk=new Set();
  if($('autoX').checked)S.mark.forEach((m,i)=>{if(m===CAT)blockedBy(i).forEach(j=>blk.add(j))});
  board.classList.toggle('focus',!!focus);
  [...board.children].forEach((d,i)=>{
    const m=S.mark[i];
    const html=m===CAT?'<span class="m cat">🐱</span>':m===NO?'<span class="m no">✕</span>':m===X?'<span class="m x">✕</span>'
      :S.lost&&isCatCell(i)?'<span class="m ghost">🐱</span>':blk.has(i)?'<span class="m dot"></span>':'';
    if(d.innerHTML!==html)d.innerHTML=html;
    d.classList.toggle('hu',!!focus&&focus.unit.has(i));
    d.classList.toggle('ht',!!focus&&focus.target.has(i));
    d.classList.toggle('wrong',i===flashCell);
    d.setAttribute('aria-label',m===CAT?'고양이':m===NO?'고양이 없음':m===X?'메모 엑스':'빈칸');
  });
  if(flashCell>=0){const k=flashCell;flashCell=-1;setTimeout(()=>board.children[k]&&board.children[k].classList.remove('wrong'),450)}
  $('lives').innerHTML=[...Array(LIVES)].map((_,k)=>`<span class="${k<S.lives?'':'gone'}">❤️</span>`).join('');
  $('found').textContent=S.mark.filter(m=>m===CAT).length;
  $('time').textContent=fmt(S.time);
  $('uCat').textContent=S.use.cat;$('uNo').textContent=S.use.no;$('uInfo').textContent=S.use.info;
  $('modeBtn').classList.toggle('on',findMode);
}

// ================= 입력 =================
const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.cell'):null};
board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('pointerdown',e=>{
  if(S.done)return;const d=cellAt(e);if(!d)return;const i=+d.dataset.i;
  if(e.button===2||(e.button===0&&findMode)){guess(i);return}
  if(e.button!==0)return;
  const m=S.mark[i];if(m===CAT||m===NO)return;
  board.setPointerCapture(e.pointerId);
  drag={start:i,moved:false,val:m===EMPTY?X:EMPTY,cells:new Set([i])};
});
board.addEventListener('pointermove',e=>{
  if(!drag)return;const d=cellAt(e);if(!d)return;const i=+d.dataset.i;
  if(drag.cells.has(i))return;
  drag.moved=true;drag.cells.add(i);
  for(const j of drag.cells)if(S.mark[j]===EMPTY||S.mark[j]===X)
    board.children[j].innerHTML=drag.val===X?'<span class="m x">✕</span>':'';
});
board.addEventListener('pointerup',()=>{if(!drag)return;const g=drag;drag=null;setX([...g.cells].map(j=>[j,g.val]))});
board.addEventListener('pointercancel',()=>{drag=null;render()});

$('newBtn').onclick=()=>newGame(+$('size').value);
$('size').onchange=()=>newGame(+$('size').value);
$('undoBtn').onclick=undo;
$('clearBtn').onclick=()=>{if(!S.done)setX(S.mark.map((m,i)=>[i,EMPTY]))};
$('modeBtn').onclick=()=>{findMode=!findMode;render()};
$('hCat').onclick=hintCat;$('hNo').onclick=hintNo;$('hInfo').onclick=hintInfo;
try{const v=localStorage.getItem('nyang-autoX');if(v!==null)$('autoX').checked=v==='1'}catch(e){}
$('autoX').onchange=e=>{try{localStorage.setItem('nyang-autoX',e.target.checked?'1':'0')}catch(_){}render()};
$('ovBtn').onclick=()=>{$('ov').classList.remove('show');newGame(+$('size').value)};
$('retryBtn').onclick=()=>{$('ov').classList.remove('show');reset()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.key.toLowerCase()==='z')undo();
});
setInterval(()=>{if(S&&!S.done&&!document.hidden){S.time++;$('time').textContent=fmt(S.time);if(S.time%5===0)save()}},1000);

if(load()){build();render();say(S.given>=0?'이 판은 정보가 부족해서 고양이 한 마리를 먼저 알려 줬어요. ("처음" 표시)':'')}
else newGame(7);
</script>
