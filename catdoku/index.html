<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥도쿠</title>
<style>
/* 한 화면 퍼즐: 상단 바 · 정사각 보드 · 도구 줄 */
:root{
  --bg:#f7f3ee; --panel:#ffffff; --ink:#2e2724; --muted:#8c7d74; --grid:rgba(60,40,30,.18);
  --wall:#3a2c25; --btn:#ece3da; --btnh:#e2d5c8; --accent:#d9692b; --bad:#d63a2f;
  --r0:#f6b6b0; --r1:#f9d38c; --r2:#bfe3a5; --r3:#a9d8ef; --r4:#cdb9f2;
  --r5:#f7c3e0; --r6:#a8e3d4; --r7:#e6d7b4; --r8:#c9cfd9; --r9:#f2a98a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1916; --panel:#28221e; --ink:#f2e8df; --muted:#a3948a; --grid:rgba(0,0,0,.35);
    --wall:#0e0b09; --btn:#372e29; --btnh:#463a33; --accent:#ff9150; --bad:#ff6b5e;
    --r0:#a35f59; --r1:#a6864a; --r2:#6a8c55; --r3:#4f7f99; --r4:#7a66a3;
    --r5:#9e6688; --r6:#4f8c7c; --r7:#8f8263; --r8:#6c7380; --r9:#a5644a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1916; --panel:#28221e; --ink:#f2e8df; --muted:#a3948a; --grid:rgba(0,0,0,.35);
  --wall:#0e0b09; --btn:#372e29; --btnh:#463a33; --accent:#ff9150; --bad:#ff6b5e;
  --r0:#a35f59; --r1:#a6864a; --r2:#6a8c55; --r3:#4f7f99; --r4:#7a66a3;
  --r5:#9e6688; --r6:#4f8c7c; --r7:#8f8263; --r8:#6c7380; --r9:#a5644a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:540px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:26px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;color:var(--ink)}
select{background:var(--btn);border:none;border-radius:8px;padding:6px 8px}
.primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.msg{min-height:1.3em;margin-top:-6px;font-size:14px;text-align:center;color:var(--accent);font-weight:600}
.board{display:grid;aspect-ratio:1;max-width:100%;border:3px solid var(--wall);border-radius:8px;overflow:hidden;
  user-select:none;touch-action:none;background:var(--wall)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:inset 0 0 0 .5px var(--grid);line-height:1}
.cell.bt{border-top:2.5px solid var(--wall)} .cell.bl{border-left:2.5px solid var(--wall)}
.cell .m{pointer-events:none}
.cell .x{color:var(--ink);opacity:.45;font-weight:700}
.cell .dot{width:18%;aspect-ratio:1;border-radius:50%;background:var(--ink);opacity:.25}
.cell.bad::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--bad) 35%,transparent) 5px 8px);pointer-events:none}
.cell.bad .cat{filter:drop-shadow(0 0 3px var(--bad))}
.cell.hint{animation:hint 1s 2}
@keyframes hint{50%{filter:brightness(1.35)}}
.cell .cat{animation:pop .2s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.cell .cat,.cell.hint{animation:none}}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{background:var(--btn);border:none;border-radius:10px;padding:10px 4px;cursor:pointer}
.tools button:hover{background:var(--btnh)}
.tools button:focus-visible,.primary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.opts{font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.help{font-size:13px;color:var(--muted);line-height:1.7}
.help b{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:24px;text-align:center;max-width:340px;width:100%}
.modal .big{font-size:56px}
.modal h2{margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐾 냥도쿠</h1>
    <div class="row">
      <select id="size" aria-label="판 크기">
        <option value="5">5×5</option><option value="6">6×6</option><option value="7" selected>7×7</option>
        <option value="8">8×8</option><option value="9">9×9</option><option value="10">10×10</option>
      </select>
      <button class="primary" id="newBtn">새 게임</button>
    </div>
  </header>
  <div class="stats">
    <span>⏱ <b id="time">00:00</b></span>
    <span>찾은 고양이 <b id="found">0</b>/<b id="total">7</b></span>
    <span>힌트 <b id="hintCount">0</b>번 사용</span>
  </div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="board" id="board" role="grid" aria-label="퍼즐 판"></div>
  <div class="tools">
    <button id="undoBtn">↩️<small>되돌리기 (Z)</small></button>
    <button id="hintBtn">💡<small>힌트 (H)</small></button>
    <button id="clearBtn">🧹<small>전부 지우기</small></button>
    <button id="checkBtn">🔍<small>검사</small></button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="autoX"> 고양이가 못 오는 칸 자동 표시</label>
    <label><input type="checkbox" id="showErr" checked> 규칙 위반 표시</label>
  </div>
  <div class="help">
    <b>규칙</b> · N×N 판에 고양이가 <b>N마리</b> 숨어 있어요. ① 색깔 구역마다 1마리 ② 가로줄·세로줄마다 1마리 ③ 고양이끼리는 대각선 포함 주변 8칸에 붙어 있을 수 없어요.<br>
    <b>조작</b> · 클릭: 빈칸 → ✕ → 🐱 → 빈칸 · 오른쪽 클릭: 바로 🐱 놓기/빼기 · 드래그: ✕ 여러 칸 표시 · Z 되돌리기 · H 힌트
  </div>
</div>
<div class="overlay" id="ov"><div class="modal">
  <div class="big">😻</div>
  <h2>고양이를 다 찾았어요!</h2>
  <div id="ovText"></div>
  <button class="primary" id="ovBtn" style="margin-top:14px;padding:10px 18px">새 게임</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const EMPTY=0,X=1,CAT=2;
let S,drag=null;

// ---------- 퍼즐 생성 ----------
const rnd=n=>Math.random()*n|0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function randomSolution(n){ // sol[r] = 고양이가 있는 열
  const sol=[],used=Array(n).fill(false);
  (function go(r){
    if(r===n)return true;
    for(const c of shuffle([...Array(n).keys()])){
      if(used[c]||(r&&Math.abs(c-sol[r-1])<2))continue;
      used[c]=true;sol[r]=c;if(go(r+1))return true;used[c]=false;
    }
    return false;
  })(0);
  return sol;
}

function growRegions(n,sol){ // 고양이 칸에서 시작해 이어진 색깔 구역을 키움
  const reg=Array(n*n).fill(-1),size=Array(n).fill(1);
  sol.forEach((c,r)=>reg[r*n+c]=r);
  let left=n*n-n;
  while(left){
    const cand=[];
    for(let i=0;i<n*n;i++)if(reg[i]<0){
      const r=i/n|0,c=i%n;
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=n||cc>=n)continue;
        const g=reg[rr*n+cc];if(g>=0)cand.push([i,g]);
      }
    }
    let tot=0;const w=cand.map(([,g])=>{const x=1/(size[g]**1.2);tot+=x;return x});
    let t=Math.random()*tot,k=0;while((t-=w[k])>0&&k<cand.length-1)k++;
    const [i,g]=cand[k];reg[i]=g;size[g]++;left--;
  }
  return reg;
}

function countSolutions(n,reg,limit=2){
  let count=0;const colUsed=Array(n).fill(false),regUsed=Array(n).fill(false);
  (function go(r,prev){
    if(count>=limit)return;
    if(r===n){count++;return}
    for(let c=0;c<n;c++){
      const g=reg[r*n+c];
      if(colUsed[c]||regUsed[g]||(r&&Math.abs(c-prev)<2))continue;
      colUsed[c]=regUsed[g]=true;go(r+1,c);colUsed[c]=regUsed[g]=false;
    }
  })(0,-9);
  return count;
}

// 정답(sol)과 다른 답을 하나 찾음. 없으면 null
function findOther(n,reg,sol){
  const colUsed=Array(n).fill(false),regUsed=Array(n).fill(false),cur=[];let found=null;
  (function go(r,prev,diff){
    if(found)return;
    if(r===n){if(diff)found=cur.slice();return}
    for(let c=0;c<n;c++){
      const g=reg[r*n+c];
      if(colUsed[c]||regUsed[g]||(r&&Math.abs(c-prev)<2))continue;
      colUsed[c]=regUsed[g]=true;cur[r]=c;go(r+1,c,diff||c!==sol[r]);colUsed[c]=regUsed[g]=false;
      if(found)return;
    }
  })(0,-9,false);
  return found;
}
// 칸 i를 빼도 원래 구역이 이어져 있는지
function staysConnected(n,reg,i){
  const g=reg[i],cells=[];for(let j=0;j<n*n;j++)if(j!==i&&reg[j]===g)cells.push(j);
  if(!cells.length)return false;
  const seen=new Set([cells[0]]),st=[cells[0]];
  while(st.length){const a=st.pop(),r=a/n|0,c=a%n;
    for(const b of [r?a-n:-1,r<n-1?a+n:-1,c?a-1:-1,c<n-1?a+1:-1])
      if(b>=0&&b!==i&&reg[b]===g&&!seen.has(b)){seen.add(b);st.push(b)}}
  return seen.size===cells.length;
}
function generate(n){ // 다른 답이 있으면 그 답의 칸을 옆 구역으로 넘겨 막음 → 답이 하나뿐인 판
  for(;;){
    const sol=randomSolution(n),reg=growRegions(n,sol);
    const isSol=new Set(sol.map((c,r)=>r*n+c));
    for(let step=0;step<400;step++){
      const alt=findOther(n,reg,sol);
      if(!alt)return {sol,reg};
      const moves=[];
      alt.forEach((c,r)=>{const i=r*n+c;if(isSol.has(i))return;
        for(const j of [r?i-n:-1,r<n-1?i+n:-1,c?i-1:-1,c<n-1?i+1:-1])
          if(j>=0&&reg[j]!==reg[i])moves.push([i,reg[j]]);});
      shuffle(moves);
      const mv=moves.find(([i])=>staysConnected(n,reg,i));
      if(!mv)break;
      reg[mv[0]]=mv[1];
    }
  }
}

// ---------- 게임 상태 ----------
function newGame(n){
  const p=generate(n);
  S={n,sol:p.sol,reg:p.reg,mark:Array(n*n).fill(EMPTY),hist:[],time:0,hints:0,done:false};
  build();save();render();
}
function save(){try{localStorage.setItem('nyang2',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('nyang2'));if(s&&s.reg&&!s.done){S=s;return true}}catch(e){}return false}

function setMarks(changes){ // [[칸, 값], ...]
  const real=changes.filter(([i,v])=>S.mark[i]!==v);if(!real.length){render();return}
  S.hist.push(real.map(([i])=>[i,S.mark[i]]));if(S.hist.length>300)S.hist.shift();
  for(const [i,v] of real)S.mark[i]=v;
  save();render();checkWin();
}
function undo(){if(S.done)return;const h=S.hist.pop();if(!h)return;for(const [i,v] of h)S.mark[i]=v;save();render()}

// 규칙 위반 칸
function conflicts(){
  const n=S.n,cats=[];S.mark.forEach((m,i)=>{if(m===CAT)cats.push(i)});
  const bad=new Set(),groups={};
  for(const i of cats){
    const r=i/n|0,c=i%n;
    for(const k of ['r'+r,'c'+c,'g'+S.reg[i]])(groups[k]=groups[k]||[]).push(i);
    for(const j of cats)if(j!==i&&Math.abs((j/n|0)-r)<=1&&Math.abs(j%n-c)<=1){bad.add(i);bad.add(j)}
  }
  for(const k in groups)if(groups[k].length>1){
    const t=k[0],v=+k.slice(1);
    for(let i=0;i<n*n;i++)if((t==='r'&&(i/n|0)===v)||(t==='c'&&i%n===v)||(t==='g'&&S.reg[i]===v))bad.add(i);
  }
  return bad;
}
// 놓인 고양이 때문에 고양이가 올 수 없는 칸
function blocked(){
  const n=S.n,b=new Set();
  S.mark.forEach((m,i)=>{if(m!==CAT)return;const r=i/n|0,c=i%n;
    for(let j=0;j<n*n;j++){if(j===i)continue;const rr=j/n|0,cc=j%n;
      if(rr===r||cc===c||S.reg[j]===S.reg[i]||(Math.abs(rr-r)<=1&&Math.abs(cc-c)<=1))b.add(j)}});
  return b;
}
function checkWin(){
  if(S.done)return;
  const ok=S.sol.every((c,r)=>S.mark[r*S.n+c]===CAT)&&S.mark.filter(m=>m===CAT).length===S.n;
  if(ok){S.done=true;save();
    $('ovText').textContent=`${S.n}×${S.n} · 기록 ${fmt(S.time)}`+(S.hints?` · 힌트 ${S.hints}번`:' · 힌트 없이 성공!');
    setTimeout(()=>$('ov').classList.add('show'),350)}
}
function hint(){
  if(S.done)return;
  const n=S.n;
  // 1) 잘못 놓은 고양이 빼기  2) 고양이 자리에 친 ✕ 고치기  3) 아직 못 찾은 고양이 하나 알려 주기
  const wrongCat=S.mark.findIndex((m,i)=>m===CAT&&S.sol[i/n|0]!==i%n);
  const wrongX=S.mark.findIndex((m,i)=>m===X&&S.sol[i/n|0]===i%n);
  let i,v,msg;
  if(wrongCat>=0){i=wrongCat;v=X;msg='여기엔 고양이가 없어요.'}
  else if(wrongX>=0){i=wrongX;v=CAT;msg='✕를 친 이 칸에 고양이가 있어요.'}
  else{const rows=[];for(let r=0;r<n;r++)if(S.mark[r*n+S.sol[r]]!==CAT)rows.push(r);if(!rows.length)return;
    const r=rows[rnd(rows.length)];i=r*n+S.sol[r];v=CAT;msg='고양이 한 마리를 찾아 줬어요.'}
  S.hints++;hintCell=i;toast(msg);setMarks([[i,v]]);
}
function check(){
  const n=S.n;let wrong=0;
  S.mark.forEach((m,i)=>{const isCat=S.sol[i/n|0]===i%n;if((m===CAT&&!isCat)||(m===X&&isCat))wrong++});
  toast(wrong?`틀린 표시가 ${wrong}개 있어요.`:'지금까지 표시한 건 모두 맞아요.');
}
let toastT;function toast(t){$('msg').textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>$('msg').textContent='',2500)}
const fmt=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');

// ---------- 화면 ----------
let hintCell=-1;
const board=$('board');
function build(){
  const n=S.n;board.innerHTML='';
  board.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  board.style.gridTemplateRows=`repeat(${n},minmax(0,1fr))`;
  const fs=Math.min(40,Math.max(14,300/n));
  for(let i=0;i<n*n;i++){
    const d=document.createElement('div'),r=i/n|0,c=i%n;
    d.className='cell'+(r&&S.reg[i]!==S.reg[i-n]?' bt':'')+(c&&S.reg[i]!==S.reg[i-1]?' bl':'');
    d.style.background=`var(--r${S.reg[i]})`;
    d.style.fontSize=`clamp(12px,${fs/5.4}vw,${fs}px)`;
    d.dataset.i=i;d.setAttribute('role','gridcell');
    board.appendChild(d);
  }
  $('total').textContent=n;$('size').value=n;
}
function render(){
  const bad=$('showErr').checked?conflicts():new Set();
  const blk=$('autoX').checked?blocked():new Set();
  [...board.children].forEach((d,i)=>{
    const m=S.mark[i];
    const html=m===CAT?'<span class="m cat">🐱</span>':m===X?'<span class="m x">✕</span>':blk.has(i)?'<span class="m dot"></span>':'';
    if(d.innerHTML!==html)d.innerHTML=html;
    d.classList.toggle('bad',bad.has(i));
    d.classList.toggle('hint',i===hintCell);
    d.setAttribute('aria-label',m===CAT?'고양이':m===X?'엑스':'빈칸');
  });
  hintCell=-1;
  $('found').textContent=S.mark.filter(m=>m===CAT).length;
  $('hintCount').textContent=S.hints;$('time').textContent=fmt(S.time);
}

// ---------- 입력: 클릭 순환, 오른쪽 클릭 고양이, 드래그 ✕ ----------
const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.cell'):null};
board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('pointerdown',e=>{
  if(S.done)return;const d=cellAt(e);if(!d)return;const i=+d.dataset.i;
  if(e.button===2){setMarks([[i,S.mark[i]===CAT?EMPTY:CAT]]);return}
  if(e.button!==0)return;
  board.setPointerCapture(e.pointerId);
  drag={start:i,moved:false,val:S.mark[i]===EMPTY?X:S.mark[i]===X?EMPTY:null,cells:new Set([i])};
});
board.addEventListener('pointermove',e=>{
  if(!drag||drag.val===null)return;const d=cellAt(e);if(!d)return;const i=+d.dataset.i;
  if(drag.cells.has(i))return;
  drag.moved=true;drag.cells.add(i);
  for(const j of drag.cells)if(S.mark[j]!==CAT)board.children[j].innerHTML=drag.val===X?'<span class="m x">✕</span>':'';
});
board.addEventListener('pointerup',()=>{
  if(!drag)return;const g=drag;drag=null;
  if(!g.moved){const m=S.mark[g.start];setMarks([[g.start,m===EMPTY?X:m===X?CAT:EMPTY]]);return}
  setMarks([...g.cells].filter(j=>S.mark[j]!==CAT).map(j=>[j,g.val]));
});
board.addEventListener('pointercancel',()=>{drag=null;render()});

$('newBtn').onclick=()=>newGame(+$('size').value);
$('size').onchange=()=>newGame(+$('size').value);
$('undoBtn').onclick=undo;$('hintBtn').onclick=hint;$('checkBtn').onclick=check;
$('clearBtn').onclick=()=>{if(!S.done)setMarks(S.mark.map((_,i)=>[i,EMPTY]))};
for(const id of ['autoX','showErr']){
  try{const v=localStorage.getItem('nyang-'+id);if(v!==null)$(id).checked=v==='1'}catch(e){}
  $(id).onchange=e=>{try{localStorage.setItem('nyang-'+id,e.target.checked?'1':'0')}catch(_){}render()};
}
$('ovBtn').onclick=()=>{$('ov').classList.remove('show');newGame(+$('size').value)};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k==='z')undo();else if(k==='h')hint();
});
setInterval(()=>{if(S&&!S.done&&!document.hidden){S.time++;$('time').textContent=fmt(S.time);if(S.time%5===0)save()}},1000);

if(load()){build();render()}else newGame(7);
</script>
</body>
</html>
